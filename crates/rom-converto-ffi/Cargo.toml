[package]
name = "rom-converto-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "C ABI bridge for embedding rom-converto."

[lib]
name = "rom_converto_ffi"
crate-type = ["cdylib"]

[dependencies]
rom-converto-lib = { path = "../rom-converto-lib", default-features = false }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[features]
default = ["embedded-keys"]
embedded-keys = ["rom-converto-lib/embedded-keys"]
