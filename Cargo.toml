[workspace]
resolver = "3"
members = [
    "crates/rom-converto-lib",
    "crates/rom-converto-cli",
    "crates/rom-converto-benchmark",
    "crates/rom-converto-gui/src-tauri",
    "crates/rom-converto-ffi",
]

[workspace.package]
version = "0.22.0"
edition = "2024"
authors = ["DevYukine <devyukine@gmx.de>"]

[workspace.dependencies]
anyhow = "^1.0"
thiserror = "^2"
log = "^0.4"
futures = "^0.3"
lazy_static = "^1.5"
tokio = "^1"
tokio-util = "^0.7"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
reqwest = { version = "^0.13", default-features = false, features = ["charset", "http2", "system-proxy", "json", "stream", "rustls"] }
ts-rs = { version = "^12", features = ["serde-compat"] }

# One codegen unit for the library keeps the FLAC and LZMA decoder hot loops
# in one unit; with the default partitioning, unrelated code changes moved
# them across units and cost about 10% throughput. The binaries keep the
# default so their release builds stay fast.
[profile.release.package.rom-converto-lib]
codegen-units = 1
