name: Build GUI

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build. Defaults to the caller ref."
        required: false
        type: string
        default: ""
      release:
        description: "Upload build outputs to a GitHub Release instead of workflow artifacts."
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Release tag to upload assets to when release is true."
        required: false
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: GUI - ${{ matrix.classifier }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            classifier: linux-x64
            bundles: --bundles appimage,deb
            config: '{}'
            release_config: '{"bundle":{"createUpdaterArtifacts":true}}'
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            classifier: linux-arm64
            bundles: --bundles appimage,deb
            config: '{}'
            release_config: '{"bundle":{"createUpdaterArtifacts":true}}'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            classifier: windows-x64
            bundles: --bundles nsis
            config: '{}'
            release_config: '{"bundle":{"createUpdaterArtifacts":true}}'
          - os: macos-latest
            target: x86_64-apple-darwin
            classifier: macos-x64
            bundles: >-
              --bundles app,dmg
              --ci
            config: '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
            release_config: '{"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"-"}}}'
          - os: macos-latest
            target: aarch64-apple-darwin
            classifier: macos-arm64
            bundles: >-
              --bundles app,dmg
              --ci
            config: '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
            release_config: '{"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"-"}}}'

    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      ROM_CONVERTO_RELEASE: ${{ inputs.release && '1' || '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            xdg-utils

      - name: Cache pinned linuxdeploy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              arch=x86_64
              url=https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
              sha256=4648f278ab3ef31f819e67c30d50f462640e5365a77637d7e6f2ad9fd0b4522a
              ;;
            aarch64-unknown-linux-gnu)
              arch=aarch64
              url=https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-aarch64.AppImage
              sha256=06706ac8189797dccd36bd384105892cb5e6e71f784f4df526cc958adc223cd6
              ;;
            *)
              echo "Unsupported Linux target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          path="${XDG_CACHE_HOME:-$HOME/.cache}/tauri/linuxdeploy-$arch.AppImage"
          mkdir -p "$(dirname "$path")"
          curl --fail --location --retry 3 --output "$path" "$url"
          echo "$sha256  $path" | sha256sum --check
          chmod +x "$path"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/rom-converto-gui/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        # Release builds run on main, whose cache scope is separate and
        # evicted between releases; skip the cache there.
        if: ${{ !inputs.release }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Both macOS targets build on the same runner arch, so the target
          # must be part of the key.
          key: gui-${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install frontend dependencies
        working-directory: crates/rom-converto-gui
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing key
        if: ${{ inputs.release }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for release builds" >&2
            exit 1
          fi

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          projectPath: crates/rom-converto-gui
          tauriScript: pnpm tauri
          args: >-
            --target ${{ matrix.target }}
            ${{ matrix.bundles }}
            --config '${{ inputs.release && matrix.release_config || matrix.config }}'
            -- --locked
          retryAttempts: 2

      - name: Package bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          classifier="${{ matrix.classifier }}"
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          mkdir -p artifact
          if [[ -n "$ROM_CONVERTO_RELEASE" ]]; then
            mkdir -p updater
          fi

          case "$RUNNER_OS" in
            Linux)
              appimages=("$bundle_dir/appimage/"*.AppImage "$bundle_dir/appimage/"*.appimage)
              debs=("$bundle_dir/deb/"*.deb)

              (( ${#appimages[@]} > 0 ))
              (( ${#debs[@]} > 0 ))

              cp "${appimages[0]}" "artifact/rom-converto-gui-${classifier}.AppImage"
              cp "${debs[0]}" "artifact/rom-converto-gui-${classifier}.deb"

              if [[ -n "$ROM_CONVERTO_RELEASE" ]]; then
                [[ -f "${appimages[0]}.sig" ]]
                [[ -f "${debs[0]}.sig" ]]
                cp "${appimages[0]}" "updater/rom-converto-gui-${classifier}.AppImage"
                cp "${appimages[0]}.sig" "updater/rom-converto-gui-${classifier}.AppImage.sig"
                cp "${debs[0]}.sig" "updater/rom-converto-gui-${classifier}.deb.sig"
              fi
              ;;

            macOS)
              app="$bundle_dir/macos/rom-converto.app"
              dmgs=("$bundle_dir/dmg/"*.dmg)

              codesign --verify --deep --strict --verbose=2 "$app"
              (( ${#dmgs[@]} > 0 ))

              ditto -c -k --sequesterRsrc --keepParent \
                "$app" \
                "artifact/rom-converto-gui-${classifier}.app.zip"
              cp "${dmgs[0]}" "artifact/rom-converto-gui-${classifier}.dmg"

              if [[ -n "$ROM_CONVERTO_RELEASE" ]]; then
                updaters=("$bundle_dir/macos/"*.app.tar.gz)
                (( ${#updaters[@]} > 0 ))
                [[ -f "${updaters[0]}.sig" ]]
                cp "${updaters[0]}" "updater/rom-converto-gui-${classifier}.app.tar.gz"
                cp "${updaters[0]}.sig" "updater/rom-converto-gui-${classifier}.app.tar.gz.sig"
              fi
              ;;

            Windows)
              installers=("$bundle_dir/nsis/"*.exe)
              exes=(
                "target/${{ matrix.target }}/release/rom-converto.exe"
                "target/${{ matrix.target }}/release/rom-converto-gui.exe"
              )

              (( ${#installers[@]} > 0 ))
              cp "${installers[0]}" "artifact/rom-converto-gui-${classifier}-setup.exe"

              for exe in "${exes[@]}"; do
                if [[ -f "$exe" ]]; then
                  cp "$exe" "artifact/rom-converto-gui-${classifier}.exe"
                  break
                fi
              done
              [[ -f "artifact/rom-converto-gui-${classifier}.exe" ]]

              if [[ -n "$ROM_CONVERTO_RELEASE" ]]; then
                [[ -f "${installers[0]}.sig" ]]
                cp "${installers[0]}" "updater/rom-converto-gui-${classifier}-setup.exe"
                cp "${installers[0]}.sig" "updater/rom-converto-gui-${classifier}-setup.exe.sig"

                # The portable exe is not a bundle, so tauri-action does not sign it.
                (cd crates/rom-converto-gui && pnpm tauri signer sign "../../artifact/rom-converto-gui-${classifier}.exe")
                [[ -f "artifact/rom-converto-gui-${classifier}.exe.sig" ]]
                mv "artifact/rom-converto-gui-${classifier}.exe.sig" "updater/rom-converto-gui-${classifier}.exe.sig"
              fi
              ;;

            *)
              echo "Unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

      - name: Upload workflow artifact
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rom-converto-gui-${{ matrix.classifier }}
          path: artifact/
          if-no-files-found: error

      - name: Upload updater artifact
        if: ${{ inputs.release }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-${{ matrix.classifier }}
          path: updater/
          if-no-files-found: error

      - name: Attest build provenance
        if: ${{ inputs.release }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifact/*
            updater/*

      - name: Upload to release
        if: ${{ inputs.release }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release_tag }}" artifact/* --repo "$GITHUB_REPOSITORY" --clobber

  updater-manifest:
    name: GUI updater manifest
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - name: Download updater artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: updater-*
          path: updater
          merge-multiple: true

      - name: Create latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body,publishedAt)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          # The plugin looks up "<os>-<arch>-<installer>" for the package type the
          # running copy was bundled as and falls back to "<os>-<arch>", so only
          # packages that differ from the fallback need their own key. The
          # portable Windows exe asks for its own key.
          jq -n \
            --arg version "${RELEASE_TAG#v}" \
            --arg notes "$(jq -r .body <<<"$release")" \
            --arg pub_date "$(jq -r .publishedAt <<<"$release")" \
            --arg base "$base" \
            --arg linux_x64_appimage "$(<updater/rom-converto-gui-linux-x64.AppImage.sig)" \
            --arg linux_x64_deb "$(<updater/rom-converto-gui-linux-x64.deb.sig)" \
            --arg linux_arm64_appimage "$(<updater/rom-converto-gui-linux-arm64.AppImage.sig)" \
            --arg linux_arm64_deb "$(<updater/rom-converto-gui-linux-arm64.deb.sig)" \
            --arg windows_x64_nsis "$(<updater/rom-converto-gui-windows-x64-setup.exe.sig)" \
            --arg windows_x64_portable "$(<updater/rom-converto-gui-windows-x64.exe.sig)" \
            --arg macos_x64 "$(<updater/rom-converto-gui-macos-x64.app.tar.gz.sig)" \
            --arg macos_arm64 "$(<updater/rom-converto-gui-macos-arm64.app.tar.gz.sig)" \
            '
            def entry($sig; $file): { signature: $sig, url: ($base + "/" + $file) };
            {
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "linux-x86_64": entry($linux_x64_appimage; "rom-converto-gui-linux-x64.AppImage"),
                "linux-x86_64-deb": entry($linux_x64_deb; "rom-converto-gui-linux-x64.deb"),
                "linux-aarch64": entry($linux_arm64_appimage; "rom-converto-gui-linux-arm64.AppImage"),
                "linux-aarch64-deb": entry($linux_arm64_deb; "rom-converto-gui-linux-arm64.deb"),
                "windows-x86_64": entry($windows_x64_nsis; "rom-converto-gui-windows-x64-setup.exe"),
                "windows-x86_64-portable": entry($windows_x64_portable; "rom-converto-gui-windows-x64.exe"),
                "darwin-x86_64": entry($macos_x64; "rom-converto-gui-macos-x64.app.tar.gz"),
                "darwin-aarch64": entry($macos_arm64; "rom-converto-gui-macos-arm64.app.tar.gz")
              }
            }' > latest.json

      - name: Upload updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.release_tag }}" updater/* latest.json --repo "$GITHUB_REPOSITORY" --clobber
