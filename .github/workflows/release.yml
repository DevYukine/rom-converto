name: Create Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    outputs:
      tag: ${{ steps.changelog.outputs.tag }}
      skipped: ${{ steps.changelog.outputs.skipped }}
    name: Create Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Create Conventional Changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@ee43def3241429afddab215ba89090cbf64fb45c # v6.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-file: "./Cargo.toml"
          version-path: "workspace.package.version"
          pre-commit: ".github/scripts/pre-commit.js"
      - name: Create Release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}

  build-cli:
    needs: changelog
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: ${{ needs.changelog.outputs.skipped == 'false' }}
    uses: ./.github/workflows/_build-cli.yml
    with:
      ref: ${{ needs.changelog.outputs.tag }}
      release: true
      release_tag: ${{ needs.changelog.outputs.tag }}
    secrets: inherit

  build-ffi:
    needs: changelog
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: ${{ needs.changelog.outputs.skipped == 'false' }}
    uses: ./.github/workflows/_build-ffi.yml
    with:
      ref: ${{ needs.changelog.outputs.tag }}
      release: true
      release_tag: ${{ needs.changelog.outputs.tag }}
    secrets: inherit

  build-gui:
    needs: changelog
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: ${{ needs.changelog.outputs.skipped == 'false' }}
    uses: ./.github/workflows/_build-gui.yml
    with:
      ref: ${{ needs.changelog.outputs.tag }}
      release: true
      release_tag: ${{ needs.changelog.outputs.tag }}
    secrets: inherit
