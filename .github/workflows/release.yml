name: Create Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    outputs:
      tag: ${{ steps.changelog.outputs.tag }}
      skipped: ${{ steps.changelog.outputs.skipped }}
    name: Create Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Conventional Changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-file: "./Cargo.toml"
          version-path: "workspace.package.version"
          pre-commit: ".github/scripts/pre-commit.js"
      - name: Write release notes
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.changelog.outputs.tag }}
          CHANGELOG: ${{ steps.changelog.outputs.clean_changelog }}
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          # The GUI updater shows only what follows the changelog marker.
          sed "s|{base}|${base}|g" > notes.md <<'EOF'
          ## Download

          | | Desktop app | Command line |
          |---|---|---|
          | Windows | [Installer]({base}/rom-converto-gui-windows-x64-setup.exe) · [Portable]({base}/rom-converto-gui-windows-x64.exe) | [x64]({base}/rom-converto-cli-windows-x64.exe) |
          | macOS | [Apple Silicon]({base}/rom-converto-gui-macos-arm64.dmg) · [Intel]({base}/rom-converto-gui-macos-x64.dmg) | [Apple Silicon]({base}/rom-converto-cli-macos-arm64) · [Intel]({base}/rom-converto-cli-macos-x64) |
          | Linux | AppImage [x64]({base}/rom-converto-gui-linux-x64.AppImage) · [arm64]({base}/rom-converto-gui-linux-arm64.AppImage)<br>deb [x64]({base}/rom-converto-gui-linux-x64.deb) · [arm64]({base}/rom-converto-gui-linux-arm64.deb) | [x64]({base}/rom-converto-cli-linux-x64) · [arm64]({base}/rom-converto-cli-linux-arm64) · [ARMv7]({base}/rom-converto-cli-linux-arm7)<br>musl [x64]({base}/rom-converto-cli-linux-x64-musl) · [arm64]({base}/rom-converto-cli-linux-arm64-musl) |
          | FreeBSD | | [x64]({base}/rom-converto-cli-freebsd-x64) |

          After this first download, the desktop app updates itself and the CLI updates with `rom-converto self-update`. `SHA256SUMS` lists the checksum of every file. The FFI library (`rom-converto-ffi-*`) and the Linux CLI builds without embedded keys (`rom-converto-cli-keyless-*`) are in the assets below.

          <!-- changelog -->
          EOF
          # Credit PR authors: "(#36)" becomes "(#36 by @DevYukine)".
          while read -r pr; do
            login=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .user.login) || { echo "::warning::no PR author for #$pr"; continue; }
            CHANGELOG=$(sed -E "s|\(\[#$pr\]\(([^)]*)\)\) \(\[([0-9a-f]{7})\]|([#$pr](\1) by @$login) ([\2]|" <<<"$CHANGELOG")
          done < <(sed -nE 's/.*\(\[#([0-9]+)\]\([^)]*\)\) \(\[[0-9a-f]{7}\].*/\1/p' <<<"$CHANGELOG" | sort -u)
          printf '%s\n' "$CHANGELOG" >> notes.md

      - name: Create Release
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.changelog.outputs.tag }}
          name: ${{ steps.changelog.outputs.tag }}
          bodyFile: notes.md

  build-cli:
    needs: changelog
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: ${{ needs.changelog.outputs.skipped == 'false' }}
    uses: ./.github/workflows/_build-cli.yml
    with:
      ref: ${{ needs.changelog.outputs.tag }}
      release: true
      release_tag: ${{ needs.changelog.outputs.tag }}
    secrets: inherit

  build-ffi:
    needs: changelog
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: ${{ needs.changelog.outputs.skipped == 'false' }}
    uses: ./.github/workflows/_build-ffi.yml
    with:
      ref: ${{ needs.changelog.outputs.tag }}
      release: true
      release_tag: ${{ needs.changelog.outputs.tag }}
    secrets: inherit

  build-gui:
    needs: changelog
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: ${{ needs.changelog.outputs.skipped == 'false' }}
    uses: ./.github/workflows/_build-gui.yml
    with:
      ref: ${{ needs.changelog.outputs.tag }}
      release: true
      release_tag: ${{ needs.changelog.outputs.tag }}
    secrets: inherit

  checksums:
    name: Checksums
    needs: [changelog, build-cli, build-ffi, build-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Download keyless builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rom-converto-cli-keyless-*
          path: keyless
          merge-multiple: true

      - name: Publish keyless builds and SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.changelog.outputs.tag }}
        run: |
          set -euo pipefail
          # Older CLIs pick a keyless build for self-update when the usual
          # binary is missing, so these go up only after every other build.
          gh release upload "$RELEASE_TAG" keyless/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          cd assets
          # The .sha256 and .sig files are checks themselves, and a rerun
          # downloads the SHA256SUMS it replaces.
          shopt -s extglob
          sha256sum !(*.sha256|*.sig|SHA256SUMS) > ../SHA256SUMS
          gh release upload "$RELEASE_TAG" ../SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
