name: Documentation
description: Something in the docs, README, or help text is wrong or missing.
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where
      description: File and section, a link, or the command whose help text is affected.
      placeholder: docs/cli.md, Dry run section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
